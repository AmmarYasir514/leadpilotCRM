<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create team preview</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f4;font:14px Arial,sans-serif;color:#1f3d69}.background{position:fixed;inset:0;width:100%;height:100%;object-fit:cover}.shade{position:fixed;inset:0;background:rgba(22,43,65,.42)}.dialog{position:fixed;top:50%;left:50%;width:min(540px,calc(100vw - 32px));transform:translate(-50%,-50%);overflow:hidden;border:1px solid #e1e9f2;border-radius:16px;background:#fff;box-shadow:0 22px 70px #152d4933}.head{display:flex;justify-content:space-between;align-items:flex-start;padding:26px 28px 18px;border-bottom:1px solid #e8eef5}.eyebrow{color:#8294ad;font-size:10px;font-weight:800;letter-spacing:.13em}.head h1{margin:6px 0 5px;font-size:24px}.head p{margin:0;color:#75869c;font-size:12px}.close{width:38px;height:38px;border:1px solid #dce6f3;border-radius:9px;background:#f7f9fc;color:#36547d;font-size:20px}.body{display:grid;gap:18px;padding:23px 28px 26px}.field{display:grid;gap:7px;color:#36547d;font-size:12px;font-weight:700}.input,.select{height:44px;padding:11px 12px;border:1px solid #d7e1ee;border-radius:8px;background:#fff;color:#36547d;font-size:13px;font-weight:400}.helper{color:#8292a8;font-size:10px;font-weight:400}.note{padding:12px 13px;border:1px solid #d6eee7;border-radius:9px;background:#f1faf7;color:#526883;font-size:11px;line-height:1.55}.note strong{color:#176b59}.footer{display:flex;justify-content:flex-end;gap:9px;padding:15px 28px;border-top:1px solid #e7edf4}.cancel,.create{padding:10px 15px;border-radius:8px;font-size:12px;font-weight:700}.cancel{border:1px solid #dce4ee;background:#fff;color:#36547d}.create{border:0;background:#07836f;color:#fff}@media(max-width:560px){.head,.body{padding-left:19px;padding-right:19px}.footer{padding-left:19px;padding-right:19px}}
</style></head><body><img class="background" src="LeadPilot-Teams-Screen-Preview.png" alt="Teams screen"><div class="shade"></div><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="create-title"><header class="head"><div><span class="eyebrow">WORKSPACE ORGANIZATION</span><h1 id="create-title">Create a team</h1><p>Add a team to organize workspace members.</p></div><button class="close" aria-label="Close">×</button></header><form class="body"><label class="field">Team name<input class="input" placeholder="For example, Customer Success"></label><label class="field">Team lead <span class="helper">Optional</span><select class="select"><option>Select a team lead</option><option>Jordan Miles</option><option>Samira Khan</option><option>Devon Chen</option></select></label><div class="note"><strong>After creating the team</strong><br>You can add members and review the team from its Manage screen.</div></form><footer class="footer"><button class="cancel">Cancel</button><button class="create">Create team</button></footer></section></body></html>
